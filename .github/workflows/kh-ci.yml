# KH: our CI (PLAN.md phase 0). Reuses Mealie's reusable lint+test workflows
# so upstream test changes arrive without copying. Mealie's own triggered
# workflows are disabled in the repo settings.
name: KH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/test-backend.yml
  frontend:
    uses: ./.github/workflows/test-frontend.yml
  ops:
    name: KH ops scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Backup script tests
        run: sh kh/ops/backup/test_backup.sh
      - name: Update script tests
        run: sh kh/ops/test_update.sh
      - name: Release script tests
        run: sh kh/ops/test_release.sh
      - name: Upgrade test logic
        run: sh kh/ops/test_upgrade.sh
      - name: Restore test logic
        run: sh kh/ops/test_restore.sh
      - name: Install script tests
        run: sh kh/ops/test_install.sh
      - name: Tunnel script tests
        run: sh kh/ops/test_tunnel.sh
      - name: Auto-update script tests
        run: sh kh/ops/test_auto_update.sh
      - name: Backup copy script tests
        run: sh kh/ops/test_backup_copy.sh
      - name: Hardware test script tests
        run: sh kh/ops/test_hardware_test.sh
      - name: License scan tests
        run: sh kh/ops/test_license_scan.sh
  # Licenses of everything that ships in the image: Python runtime packages (with the pgsql
  # extra, as the Dockerfile exports them) and the frontend's production packages.
  licenses:
    name: KH license scan
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev
          pip install uv
          uv sync --no-dev --extra pgsql
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Install npm packages
        run: pnpm install --prefer-offline
        working-directory: frontend
      - name: Scan licenses
        run: KH_PYTHON=.venv/bin/python sh kh/ops/license_scan.sh all
