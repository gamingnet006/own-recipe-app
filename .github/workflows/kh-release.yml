# KH: release images (PLAN.md phase 1, D20). A version tag builds the amd64 app image and pushes
# it to GHCR as <tag>-amd64. kh/ops/release.sh on the Mac adds <tag>-arm64.
name: KH Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    name: amd64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          # Plain image without attestation manifests (they would show up as extra untagged versions).
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            COMMIT=${{ github.sha }}
